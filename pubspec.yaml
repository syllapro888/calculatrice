name: calculatrice
description: Calculatrice - carnet de change (FCFA, USD, EUR) avec clients, dettes et journal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  uuid: ^4.0.0
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 23
